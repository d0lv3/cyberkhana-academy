<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Cyberkhana Academy</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0d1117; color: #f3f6ff; font: 16px/1.7 system-ui, sans-serif; text-align: center; }
      main { width: 100%; max-width: 400px; }
      img { border-radius: 20px; }
      h1 { font-size: 24px; line-height: 1.4; }
      p { color: #9aa5bf; }
      button { min-height: 44px; border: 0; border-radius: 10px; background: #007a42; color: white; font: inherit; font-weight: 700; padding: 10px 24px; cursor: pointer; }
      button:focus-visible { outline: 2px solid #00a859; outline-offset: 4px; }
    </style>
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/assets/brand/favicon-192.png" width="80" height="80" alt="Cyberkhana" />
      <p><bdi>Cyberkhana Academy</bdi></p>
      <h1 id="title">You’re offline</h1>
      <p id="message">Connect to the internet to open your lessons and sync your progress.</p>
      <button id="retry" type="button">Try again</button>
    </main>
  </body>
</html>
